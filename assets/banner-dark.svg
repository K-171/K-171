<style>
.sans{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.pulse{animation:run 5.5s linear infinite}
.led{animation:blink 2.4s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 5.5s ease-in-out infinite}
