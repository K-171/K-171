@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes grow{0%,80%{transform:scaleY(1)}90%{transform:scaleY(1.18)}100%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.pulse,.led,.bar{animation:none} .pulse{opacity:0}}
</style>
